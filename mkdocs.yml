site_name: trnblas
site_description: BLAS operations for AWS Trainium via NKI
site_url: https://trnsci.github.io/trnblas/
repo_url: https://github.com/trnsci/trnblas
repo_name: trnsci/trnblas

theme:
  name: material
  font:
    text: Atkinson Hyperlegible
    code: Atkinson Hyperlegible Mono
  palette:
    scheme: default
    primary: indigo
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - API Reference:
      - Level 1 (Vector): api/level1.md
      - Level 2 (Matrix-Vector): api/level2.md
      - Level 3 (Matrix-Matrix): api/level3.md
      - NKI Backend: api/nki.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - Deployment:
      - AWS Setup for Neuron CI: aws_setup.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
