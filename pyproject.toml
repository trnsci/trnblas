[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trnblas"
version = "0.5.3"
description = "BLAS operations for AWS Trainium via NKI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Scott Friedman", email = "scttfrdmn@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
neuron = [
    # NKI 0.3.0 Stable (Neuron SDK 2.29+, April 2026). trnblas imports
    # from the canonical `nki.*` namespace; the legacy `neuronxcc.nki.*`
    # shim is not used. SDK 2.29 DLAMI bundles nki==0.3.0 alongside
    # neuronxcc==2.24.5133.
    "nki>=0.3.0",
    "neuronxcc>=2.24",
    "torch-neuronx>=2.9",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "scipy>=1.11",
]
pyscf = [
    "pyscf>=2.4",
]

[project.urls]
Homepage = "https://github.com/trnsci/trnblas"
Documentation = "https://trnsci.dev/trnblas/"
Repository = "https://github.com/trnsci/trnblas"
Issues = "https://github.com/trnsci/trnblas/issues"

[tool.setuptools.packages.find]
include = ["trnblas*"]

[tool.uv]
# neuronxcc / torch-neuronx are only available on Trainium instances.
# Exclude the [neuron] extra from local uv resolution so `uv run` / `uv sync`
# works on dev machines without hardware (CI installs it on-instance manually).
exclude-dependencies = [
    "neuronxcc",
    "torch-neuronx",
    "nki",
]

[tool.ruff]
# Match the rest of the trnsci suite. Line length 100 is a compromise
# between black's 88 and the wider tables common in scientific code.
line-length = 100
target-version = "py310"
extend-exclude = ["site", "infra/terraform*/.terraform"]

[tool.ruff.lint]
# Sensible default selection: pycodestyle (E/W), Pyflakes (F), isort (I),
# pyupgrade (UP), flake8-bugbear (B), flake8-simplify (SIM). Skip docstring
# rules (D*) — we're deliberately light on docstrings in this project.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — formatter handles it
    "B008",   # function call in default arg — common + intentional here
    "SIM108", # if/else → ternary — explicit form reads better in BLAS flag dispatch
    "E741",   # ambiguous name `I` — conventional for identity matrix in math code
]

[tool.ruff.lint.per-file-ignores]
# NKI kernels use patterns that trip some lint rules (SBUF writes that
# look unused to the linter, etc). Don't fight the kernel authoring loop.
"trnblas/nki/dispatch.py" = ["F841", "B007"]
"scripts/*" = ["F401"]
"tests/*"   = ["F401", "F811"]

[tool.ruff.format]
# Black-compatible defaults.
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
    "neuron: requires Neuron hardware (trn1/trn2 instance)",
    "pyscf: requires PySCF (pip install trnblas[pyscf])",
    "slow: long-running tests skipped by default (run with -m slow)",
]
testpaths = ["tests"]
